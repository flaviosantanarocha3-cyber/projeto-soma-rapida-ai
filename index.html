<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/footer.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech&display=swap"
        rel="stylesheet">

    <title>-Soma-Rápida-</title>

</head>

<body>

    <section>
        <div class="container">
            <!-- Seção principal: Cartão -->
            <div class="cartao">

                <!-- Seção: Cabeçalho do app -->
                <div class="cabecalho">
                    <h1 class="titulo">Soma-Rápida</h1>
                    <p class="sub-titulo">Transforme comprovantes físicos em dados precisos. Com uma simples foto, nossa
                        inteligência artificial processa e consolida suas despesas em tempo real.</p>
                </div>

                </header>

                <!-- Seção: Total de gastos -->
                <div class="caixa-total">
                    <p>Total gasto</p>
                    <h2 class="total-gasto">R$ 0.00</h2>
                    
                </div>

                <div class="resumo-comprovante ">
                    
                </div>

                <!-- Seção: Upload de imagem -->
                <div class="secao-upload">
                    <label for="arquivo" class="rotulo-upload">
                        Toque para fotografar o comprovante
                        <input class="foto" type="file" id="arquivo" accept="image/*" onchange="lerFoto()">
                    </label>
                </div>

                <!-- Seção: Rodapé do cartão -->
                <div class="rodape">
                    <span class="icone-engrenagem">⚙️</span>
                    <span class="texto-powered">Desenvolvido por Flavio Santana</span>
                </div>
            </div>

            <!-- Seção: Barra inferior -->
            <div class="barra-inferior">
                <span class="texto-marca">Flavio Santana 2026</span>
            </div>
        </div>
    </section>

    <script src="https://js.puter.com/v2/"></script>
    <script src="script.js"></script>

</body>

</html>
